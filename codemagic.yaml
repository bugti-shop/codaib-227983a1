workflows:
  ios-app-store:
    name: Flowist
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flowist.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        BUNDLE_ID: "com.flowist.app"
        PROVISIONING_PROFILE_NAME: "Flowist_Distribution"
        node: 22.11.0
      xcode: 26.0
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npm run build

      - name: Bump iOS deployment target to 15.0
        script: |
          # Ensure Podfile platform is 15.0
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/g" ios/App/Podfile || true
          # Bump IPHONEOS_DEPLOYMENT_TARGET in Xcode project
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "iOS deployment target set to 15.0"

      - name: Capacitor sync
        script: |
          set -e
          rm -f ios/App/Podfile.lock ios/App/Pods/Manifest.lock
          npx cap copy ios
          cd ios/App
          pod install --repo-update
          cd ../..
          npx cap update ios

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Verify privacy manifests
        script: |
          bash ios-privacy-patches/audit-privacy-manifests.sh ios/App

      - name: Patch PurchasesHybridCommon
        script: |
          FILE="ios/App/Pods/PurchasesHybridCommon/ios/PurchasesHybridCommon/PurchasesHybridCommon/StoreProduct+HybridAdditions.swift"
          sed -i '' 's/subscriptionPeriod: SubscriptionPeriod)/subscriptionPeriod: RevenueCat.SubscriptionPeriod)/g' "$FILE"
          sed -i '' 's/subscriptionPeriodUnit: SubscriptionPeriod.Unit)/subscriptionPeriodUnit: RevenueCat.SubscriptionPeriod.Unit)/g' "$FILE"
          echo "Patch applied!"

      - name: App Store Connect preflight & version bump
        script: |
          set -e
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/App/App/Info.plist

          # --- Helpers --------------------------------------------------------
          # Bump the patch component (or append .1) of a semver-ish string.
          bump_patch() {
            local v="$1"
            local major minor patch
            major=$(echo "$v" | awk -F. '{print ($1==""?0:$1)}')
            minor=$(echo "$v" | awk -F. '{print ($2==""?0:$2)}')
            patch=$(echo "$v" | awk -F. '{print ($3==""?0:$3)}')
            patch=$((patch + 1))
            echo "${major}.${minor}.${patch}"
          }

          # Compare two dotted versions. Echoes -1, 0, or 1 (a<b, a==b, a>b).
          vercmp() {
            python3 - "$1" "$2" <<'PY'
          import sys
          def parse(v):
              return [int(x) for x in v.split('.') if x.isdigit()]
          a, b = parse(sys.argv[1]), parse(sys.argv[2])
          # pad
          n = max(len(a), len(b))
          a += [0]*(n-len(a)); b += [0]*(n-len(b))
          print(-1 if a<b else (1 if a>b else 0))
          PY
          }

          # --- Query App Store Connect ---------------------------------------
          # Codemagic's `app_store_connect: Codemagic` integration exports the
          # API key env vars consumed by the `app-store-connect` CLI.
          echo "Fetching latest App Store version for $BUNDLE_ID..."
          LATEST_APPSTORE_VERSION=""
          LATEST_BUILD_NUMBER=""

          if command -v app-store-connect >/dev/null 2>&1; then
            # Latest build number across TestFlight + App Store for this bundle id.
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID" 2>/dev/null || true)

            # Latest App Store version string (released or in review).
            LATEST_APPSTORE_VERSION=$(app-store-connect app-store-versions list \
              --bundle-id "$BUNDLE_ID" \
              --json 2>/dev/null \
              | python3 -c "import sys,json
try:
    d=json.load(sys.stdin)
    items=d if isinstance(d,list) else d.get('data',[])
    vers=[]
    for it in items:
        a=it.get('attributes',{})
        v=a.get('versionString') or a.get('version')
        s=(a.get('appStoreState') or '').upper()
        if v: vers.append((v,s))
    # Prefer versions not in an editable/closed-for-upload state
    closed={'PENDING_DEVELOPER_RELEASE','READY_FOR_SALE','PROCESSING_FOR_APP_STORE','IN_REVIEW','WAITING_FOR_REVIEW','DEVELOPER_REMOVED_FROM_SALE','REPLACED_WITH_NEW_VERSION','REMOVED_FROM_SALE'}
    from functools import cmp_to_key
    def cmp(a,b):
        pa=[int(x) for x in a[0].split('.') if x.isdigit()]
        pb=[int(x) for x in b[0].split('.') if x.isdigit()]
        n=max(len(pa),len(pb)); pa+=[0]*(n-len(pa)); pb+=[0]*(n-len(pb))
        return -1 if pa<pb else (1 if pa>pb else 0)
        vers.sort(key=cmp_to_key(cmp), reverse=True)
    print(vers[0][0] if vers else '')
except Exception:
    print('')" 2>/dev/null || true)
          else
            echo "WARN: app-store-connect CLI not found; falling back to date-based bump"
          fi

          echo "Latest App Store version : '${LATEST_APPSTORE_VERSION:-unknown}'"
          echo "Latest build number      : '${LATEST_BUILD_NUMBER:-unknown}'"

          # --- Preflight: refuse to upload into a closed train ---------------
          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/App/App/Info.plist 2>/dev/null || echo "")
          # Resolve $(MARKETING_VERSION) placeholder if present
          if [[ "$CURRENT_VERSION" == *MARKETING_VERSION* || -z "$CURRENT_VERSION" ]]; then
            CURRENT_VERSION=$(grep -m1 "MARKETING_VERSION = " ios/App/App.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/')
          fi
          echo "Current project version  : '$CURRENT_VERSION'"

          if [ -n "$LATEST_APPSTORE_VERSION" ]; then
            CMP=$(vercmp "$CURRENT_VERSION" "$LATEST_APPSTORE_VERSION")
            if [ "$CMP" != "1" ]; then
              NEW_VERSION=$(bump_patch "$LATEST_APPSTORE_VERSION")
              echo "Train '$LATEST_APPSTORE_VERSION' is closed or matches current. Bumping to '$NEW_VERSION'."
            else
              NEW_VERSION="$CURRENT_VERSION"
              echo "Current version '$CURRENT_VERSION' is already higher than App Store latest."
            fi
          else
            # No data from ASC — bump locally to stay safe.
            NEW_VERSION=$(bump_patch "${CURRENT_VERSION:-1.0.0}")
            echo "Falling back to local bump: '$NEW_VERSION'"
          fi

          # Apply marketing version to both pbxproj and Info.plist
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${NEW_VERSION};/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NEW_VERSION}" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${NEW_VERSION}" ios/App/App/Info.plist

          # --- Always increment CFBundleVersion (build number) ---------------
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            NEW_BUILD=$((LATEST_BUILD_NUMBER + 1))
          else
            NEW_BUILD=$(($(date +%s) / 60))
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NEW_BUILD}" ios/App/App/Info.plist

          echo "==> Marketing version: $NEW_VERSION"
          echo "==> Build number     : $NEW_BUILD"

      - name: Set CODE_SIGN_ENTITLEMENTS in Xcode project
        script: |
          cd ios/App
          PROJ="App.xcodeproj/project.pbxproj"
          if grep -q "CODE_SIGN_ENTITLEMENTS" "$PROJ"; then
            sed -i '' 's|CODE_SIGN_ENTITLEMENTS = .*;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements;|g' "$PROJ"
          else
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER/a\
                    CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;' "$PROJ"
          fi

      - name: Use Codemagic provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build & Archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "App" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            clean archive

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist ios/App/ExportOptions.plist

    artifacts:
      - build/ios/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

      email:
        recipients:
          - bugtishop@gmail.com
        notify:
          success: true
          failure: true
